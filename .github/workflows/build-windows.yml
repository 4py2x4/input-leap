name: build-windows-patched

on:
  workflow_dispatch:
  push:
    branches:
      - ime-keys
jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ★以下のステップを追加
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qttools'
	    
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qttools'

      - name: Install OpenSSL
        run: |
          choco install openssl -y

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DINPUTLEAP_BUILD_GUI=ON `
            -DINPUTLEAP_BUILD_TESTS=OFF `
            -DQT_DEFAULT_MAJOR_VERSION=6 `
            -DOPENSSL_ROOT_DIR="C:\Program Files\OpenSSL-Win64"

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Get-ChildItem build -Recurse -Filter *.exe |
            Copy-Item -Destination dist -Force

          Get-ChildItem build -Recurse -Filter *.dll |
            Copy-Item -Destination dist -Force

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:Qt6_DIR 'bin'
          $deploy = Join-Path $qtBin 'windeployqt.exe'

          Get-ChildItem dist -Filter *.exe |
            ForEach-Object {
              & $deploy --release $_.FullName
            }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-leap-win64-ime-patch
          path: dist
          if-no-files-found: error
