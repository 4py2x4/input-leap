name: build-windows-patched

on:
  workflow_dispatch:
  push:
    branches:
      - ime-keys

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 --outputdir C:\Qt
          echo "Qt6_DIR=C:\Qt\6.7.3\msvc2019_64" >> $env:GITHUB_ENV
          echo "C:\Qt\6.7.3\msvc2019_64\bin" >> $env:GITHUB_PATH

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl.light -y
          $possiblePaths = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\tools\openssl"
          )
          foreach ($p in $possiblePaths) {
            if (Test-Path $p) {
              echo "OPENSSL_ROOT_DIR=$p" >> $env:GITHUB_ENV
              break
            }
          }

      - name: Install Bonjour SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          Invoke-WebRequest 'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' -OutFile 'deps\BonjourSDKLike.zip'
          Expand-Archive deps\BonjourSDKLike.zip -DestinationPath deps\BonjourSDKLike
          $bonjourPath = Join-Path (Get-Location).Path "deps\BonjourSDKLike"
          echo "BONJOUR_SDK_HOME=$bonjourPath" >> $env:GITHUB_ENV
          echo "DNSSD_LIB=$bonjourPath\Lib\x64\dnssd.lib" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DINPUTLEAP_BUILD_GUI=ON `
            -DINPUTLEAP_BUILD_TESTS=OFF `
            -DQT_DEFAULT_MAJOR_VERSION=6 `
            -DDNSSD_LIB="$env:DNSSD_LIB"

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Get-ChildItem build -Recurse -Filter *.exe |
            Copy-Item -Destination dist -Force

          Get-ChildItem build -Recurse -Filter *.dll |
            Copy-Item -Destination dist -Force

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          $qtBin = Join-Path$env:Qt6_DIR 'bin'
          $deploy = Join-Path$qtBin 'windeployqt.exe'

          Get-ChildItem dist -Filter *.exe |
            ForEach-Object {
              & $deploy --release$_.FullName
            }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-leap-win64-ime-patch
          path: dist
          if-no-files-found: error
